<head>
    <meta charset="utf-8">
    <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:site_name" content="{{ site.title | escape }}">

    {% if page.title %}
    <meta property="og:type" content="article">
    <meta property="og:title" content="{{ page.title | escape }}">
    {% endif %}

    {% if page.excerpt %}
    <meta name="description" property="og:description" content="{{ page.excerpt | strip_html | strip | escape }}">
    {% endif %}

    {% if page.thumbnail %}
    <meta property="og:image" content="{{ page.thumbnail | prepend: '/images/' | absolute_url }}">
    {% endif %}

    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
    <meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}">

    <link rel="stylesheet" href="{{ '/css/main.css' | absolute_url }}">

    {% if page.layout == 'post' %}
    <meta property="article:published_time" content="{{ page.date | date: "%F" }}">
    {% endif %}

    {% if page.path contains '.md' %}
    <link rel="alternate" type="text/markdown" href="https://raw.githubusercontent.com/Sjord/Sjord.github.io/refs/heads/master/{{ page.path | replace: '/index.html', '' | escape }}" title="Markdown source">
    {% endif %}
</head>
